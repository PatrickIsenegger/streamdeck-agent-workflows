<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Agent-assisted Stream Deck workflow</title>
  <desc id="desc">A Stream Deck workflow showing export, Git review, agent edits, human approval, manual import, and device testing.</desc>
  <rect width="1200" height="675" fill="#fdfdfc"/>
  <g fill="none" stroke="#dfdfda" stroke-width="2">
    <path d="M90 118h1020M90 558h1020M90 118v440M1110 118v440"/>
  </g>
  <g font-family="ui-serif, Georgia, serif" fill="#1f2a2e">
    <text x="600" y="70" text-anchor="middle" font-size="42" font-weight="700">Stream Deck Agent Workflow</text>
    <text x="600" y="104" text-anchor="middle" font-size="20" fill="#65716d">Agents edit artifacts. Humans import and test.</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#253033">
    <g transform="translate(125 205)">
      <rect width="150" height="110" rx="12" fill="#202528"/>
      <g transform="translate(24 22)">
        <rect width="28" height="28" rx="5" fill="#f4efe5"/><rect x="38" width="28" height="28" rx="5" fill="#d9eef0"/><rect x="76" width="28" height="28" rx="5" fill="#f0d6c5"/>
        <rect y="40" width="28" height="28" rx="5" fill="#d6e5cf"/><rect x="38" y="40" width="28" height="28" rx="5" fill="#e9dfef"/><rect x="76" y="40" width="28" height="28" rx="5" fill="#f1e7c2"/>
      </g>
      <text x="75" y="150" text-anchor="middle">export</text>
    </g>
    <g transform="translate(330 205)">
      <rect width="150" height="110" rx="12" fill="#ffffff" stroke="#cfd9d5"/>
      <path d="M48 38h54M48 56h54M48 74h38" stroke="#8b3a3a" stroke-width="6" stroke-linecap="round"/>
      <text x="75" y="150" text-anchor="middle">Git repo</text>
    </g>
    <g transform="translate(535 205)">
      <rect width="150" height="110" rx="12" fill="#ffffff" stroke="#cfd9d5"/>
      <path d="M44 74c18-46 44-46 62 0" stroke="#2f6f73" stroke-width="7" fill="none" stroke-linecap="round"/>
      <circle cx="75" cy="48" r="10" fill="#2f6f73"/>
      <text x="75" y="150" text-anchor="middle">agent edit</text>
    </g>
    <g transform="translate(740 205)">
      <rect width="150" height="110" rx="12" fill="#ffffff" stroke="#cfd9d5"/>
      <path d="M42 58l22 22 46-52" stroke="#8b3a3a" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="75" y="150" text-anchor="middle">review</text>
    </g>
    <g transform="translate(945 205)">
      <rect width="150" height="110" rx="12" fill="#ffffff" stroke="#cfd9d5"/>
      <path d="M42 76h66M75 34v42M58 51l17-17 17 17" stroke="#253033" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="75" y="150" text-anchor="middle">manual import</text>
    </g>
  </g>
  <g fill="none" stroke="#8b3a3a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M285 260h34M319 260l-12-10M319 260l-12 10"/>
    <path d="M490 260h34M524 260l-12-10M524 260l-12 10"/>
    <path d="M695 260h34M729 260l-12-10M729 260l-12 10"/>
    <path d="M900 260h34M934 260l-12-10M934 260l-12 10"/>
  </g>
  <g font-family="ui-serif, Georgia, serif" fill="#253033" font-size="24">
    <text x="600" y="470" text-anchor="middle">Keep backups outside the agent workspace. Keep diffs small. Test every changed key.</text>
  </g>
</svg>
